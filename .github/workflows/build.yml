name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1. 拉取代码
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. 安装依赖 & 设置 Theos
    - name: Setup Theos
      run: |
        # 安装 Homebrew (如果未安装)
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        
        # 安装 git, ldid, xz (xz用于解压tar.xz)
        brew install git ldid xz
        
        # 克隆 Theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
    # 3. 下载并配置 iOS SDK (修复核心)
    - name: Setup iOS SDK
      run: |
        echo "Setting up iOS SDK..."
        
        # 定义 SDK 目录
        mkdir -p $THEOS/sdks
        
        # 【关键修复】使用社区维护的 Prebuilt SDK 直链 (iPhoneOS 16.5)
        # 注意：这里使用的是 .tar.xz 格式的真实 SDK，而不是 GitHub 的源码 zip 包
        curl -L -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.tar.xz
        
        # 解压 SDK
        # -x: 解压, -J: 使用 xz 算法, -f: 文件, -C: 指定目录
        tar -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
        
        # 清理压缩包
        rm $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
        
        # 创建符号链接 (可选，方便 Makefile 引用)
        ln -s $THEOS/sdks/iPhoneOS16.5.sdk $THEOS/sdks/iPhoneOS.sdk

    # 4. 编译 Tweak
    - name: Build Tweak
      run: |
        echo "Building package..."
        # 进入项目目录（如果 Makefile 不在根目录，需 cd 进去，看图应该在根目录）
        make package FINALPACKAGE=1
        
    # 5. 上传产物
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Package
        path: packages/*.deb
