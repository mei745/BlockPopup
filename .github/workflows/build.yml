name: Build iOS Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Dependencies
        run: |
          brew install ldid dpkg perl p7zip
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          
          # 强制解压到指定目录，确保SDK名称匹配
          mkdir -p $THEOS/sdks/iPhoneOS16.5.sdk
          7z x ./sdks/iPhoneOS16.5.sdk.zip.7z -o$THEOS/sdks/iPhoneOS16.5.sdk
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build Tweak & Deb
        run: |
          make build-deb
          mkdir -p ./output
          cp BlockPopup.deb ./output/

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup-deb
          path: ./output/BlockPopup.deb
