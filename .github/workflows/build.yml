name: Build iOS Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1. 检出代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 安装依赖 & 设置 Theos
    - name: Setup Theos
      run: |
        # 安装 Homebrew (如果未安装)
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        
        # 安装必要工具：git, ldid, xz (xz用于解压tar.xz)
        brew install git ldid xz
        
        # 克隆 Theos 到当前目录的 theos 文件夹
        git clone --recursive https://github.com/theos/theos.git
        
        # 设置环境变量，指向当前目录下的 theos
        echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV

    # 3. 下载并配置 iOS SDK (修复了只读文件系统错误)
    - name: Setup iOS SDK
      run: |
        echo "Downloading iOS 16.5 SDK..."
        
        # 1. 创建 sdks 目录（在当前工作目录下，而不是根目录 /）
        # 使用 $GITHUB_WORKSPACE 确保路径绝对正确
        mkdir -p $GITHUB_WORKSPACE/sdks
        
        # 2. 下载预编译的 SDK (使用稳定直链)
        # 这里使用的是 iphoneos-arm64 16.5 版本
        curl -L -o $GITHUB_WORKSPACE/sdks/iphoneos16.5.tar.xz https://github.com/theos/sdks/raw/master/iphoneos16.5.tar.xz
        
        # 3. 解压 SDK
        # -x: 解压, -J: 使用 xz 解压, -f: 指定文件, -C: 指定解压目录
        # 注意：macOS 自带 tar 支持 -J，如果不支持则需 brew install gnu-tar
        tar -xJf $GITHUB_WORKSPACE/sdks/iphoneos16.5.tar.xz -C $GITHUB_WORKSPACE/sdks
        
        # 4. 重命名文件夹（去掉版本号后缀，方便 Makefile 引用）
        mv $GITHUB_WORKSPACE/sdks/iphoneos16.5.sdk $GITHUB_WORKSPACE/sdks/iphoneos.sdk

    # 4. 编译 Tweak
    - name: Build Tweak
      env:
        # 再次确认环境变量传递
        THEOS: ${{ env.THEOS }}
      run: |
        # 执行 make 打包
        # 指定 SDK 路径，防止找不到
        make package THEOS_PROJECT_DIR=$GITHUB_WORKSPACE
        
        # 列出产物确认
        ls -R packages

    # 5. 上传产物
    - name: Upload Deb
      uses: actions/upload-artifact@v4
      with:
        name: BlockPopup-deb
        path: ./packages/*.deb
