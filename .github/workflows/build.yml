name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖工具
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 下载 iOS SDK (先下载 SDK 到临时目录，避免冲突)
      - name: Download iOS SDKs
        run: |
          # 创建临时目录下载 SDK
          mkdir -p $HOME/sdks_temp
          # 下载并解压
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $HOME/sdks_temp --strip-components=1

      # 4. 配置 Theos 环境
      - name: Configure Theos
        run: |
          # 1. 设置环境变量
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH
          
          # 2. 强制克隆 Theos 到 /opt/theos
          # 注意：这里不需要 sudo，因为 /opt 在 macOS runner 上通常是可以写的，或者我们可以用 $HOME/theos
          # 为了保险起见，我们使用 $HOME/theos 作为安装路径，这是最稳妥的
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
          # 3. 移动 SDK 到正确位置
          mkdir -p $HOME/theos/sdks
          mv $HOME/sdks_temp/* $HOME/theos/sdks/

          # 4. 克隆 Theos (如果已存在则先删除)
          rm -rf $HOME/theos/.git # 清除可能存在的旧 git 信息
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos

      # 5. 编译插件
      - name: Build Tweak
        run: |
          # 进入工作目录
          cd $GITHUB_WORKSPACE
          # 编译 (Makefile 会自动检测 SDK 版本)
          make package

      # 6. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: packages/*.deb
