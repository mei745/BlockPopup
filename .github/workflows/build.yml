name: Build iOS Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1. 检出代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 安装依赖 & 设置 Theos
    - name: Setup Theos Environment
      run: |
        echo "Installing Homebrew..."
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        
        echo "Installing dependencies..."
        brew install ldid xz git
        
        echo "Cloning Theos..."
        git clone --recursive https://github.com/theos/theos.git
        echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV

    # 3. 下载并安装 iOS SDK (已修复链接和权限问题)
    - name: Setup iOS SDK
      run: |
        echo "Creating sdks directory..."
        # 在当前项目目录下创建 sdks 文件夹
        mkdir -p sdks
        
        echo "Downloading iOS 16.5 SDK..."
        # 使用 GitHub API 直链，确保下载到的是真实的 tar.gz 包
        # -L 参数非常重要，用于跟随重定向
        curl -L -o sdks/iOS_16.5.tar.gz https://api.github.com/repos/theos/sdks/tarball/master
        
        echo "Extracting SDK..."
        # 解压到 sdks 目录
        tar -xzf sdks/iOS_16.5.tar.gz -C sdks
        
        # 重命名解压出来的文件夹（通常是 theos-sdks-xxxx）为 iPhoneOS16.5.sdk
        # 这样 Theos 才能识别
        mv sdks/theos-sdks* sdks/iPhoneOS16.5.sdk

    # 4. 编译 Tweak
    - name: Build Tweak
      run: |
        echo "Building..."
        # 确保 make 命令能找到 THEOS
        make package FINALPACKAGE=1

    # 5. 上传产物 (已升级到 v4)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tweak-Package
        path: packages/*.deb
