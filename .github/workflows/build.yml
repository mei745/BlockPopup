name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖工具
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 下载 iOS SDK (必须先下载到临时目录)
      - name: Download iOS SDKs
        run: |
          # 1. 创建临时目录下载 SDK，避免和 Theos 目录冲突
          mkdir -p $HOME/sdks_temp
          # 2. 下载并解压
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $HOME/sdks_temp --strip-components=1

      # 4. 配置 Theos 环境
      - name: Configure Theos
        run: |
          # 1. 设置环境变量
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

          # 2. 确保 /opt/theos 是干净的 (强制删除旧文件)
          sudo rm -rf /opt/theos

          # 3. 克隆 Theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos

          # 4. 将刚才下载的 SDK 移动到 Theos 目录
          sudo mv $HOME/sdks_temp /opt/theos/sdks

          # 5. 验证 SDK 是否存在
          ls /opt/theos/sdks

      # 5. 编译插件 (自动适配 SDK 版本)
      - name: Build Tweak
        run: |
          # 自动检测 SDK 文件夹名称 (例如 iPhoneOS18.0.sdk)
          export SDK=$(ls $THEOS/sdks | head -n 1)
          echo "👉 Using SDK: $SDK"

          # 执行编译，指定找到的 SDK
          make "SDKVERSION=${SDK%.sdk}"
