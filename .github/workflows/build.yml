name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖工具
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 下载 iOS SDK
      - name: Download iOS SDKs
        run: |
          # 创建目录
          mkdir -p $HOME/theos/sdks
          # 下载并解压 SDK (Theos 官方维护的 SDK 集合)
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $HOME/theos/sdks --strip-components=1
          
          # 【关键修复】自动获取 sdks 目录下的文件夹名（例如 iPhoneOS18.0.sdk）
          export THEOS_SDK_DIR=$(ls $HOME/theos/sdks | head -n 1)
          echo "Detected SDK: $THEOS_SDK_DIR"
          
          # 将变量写入环境变量，供后续步骤使用
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_SDK_DIR=$THEOS_SDK_DIR" >> $GITHUB_ENV
          echo "SDKVERSION=$(echo $THEOS_SDK_DIR | sed 's/.sdk//')" >> $GITHUB_ENV

      # 4. 配置 Theos 环境
      - name: Configure Theos
        run: |
          # 克隆 Theos 到用户目录（避免权限问题，尽量不用 sudo）
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      # 5. 编译插件
      - name: Build Tweak
        run: |
          # 直接使用上面自动获取的 SDKVERSION 进行编译
          make package SDKVERSION=$SDKVERSION
          
          # 提示：如果你的项目需要指定 TARGET (如 arm64)，可以在这里追加 TARGET=iphone:clang:14.0:14.0

      # 6. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: packages/*.deb
