name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg perl
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o $THEOS/bin/dm.pl
          chmod +x $THEOS/bin/dm.pl
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build package
        run: make package
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup.deb
          path: packages/*.deb
