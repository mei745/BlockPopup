name: Build iOS Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Dependencies
        run: |
          # 安装依赖（含p7zip用于解压.7z）
          brew install ldid dpkg perl p7zip
          
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          
          # 解压.7z格式的SDK包
          mkdir -p $THEOS/sdks
          7z x ./sdks/iPhoneOS16.5.sdk.zip.7z -o$THEOS/sdks
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build Tweak & Package
        run: |
          make clean
          make package
          mkdir -p ./output
          cp .theos/_/*.deb ./output/

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup-deb
          path: ./output/*.deb
