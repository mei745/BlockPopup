name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: robbiehanson/theos-action@v1
        with:
          sdk: iphoneos16.5
          theos-version: latest
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: .theos/_/*.deb
