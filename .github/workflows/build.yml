name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install dpkg ldid

      - name: Download iOS SDKs
        run: |
          mkdir -p $HOME/theos/sdks
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $HOME/theos/sdks --strip-components=1

      - name: Configure Theos
        run: |
          # 修复：先删除旧目录，再克隆
          rm -rf $HOME/theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # 设置环境变量
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          echo "THEOS_DEVICE_IP=127.0.0.1" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          cd $GITHUB_WORKSPACE
          make SDKVERSION=17.0 package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: ${{ github.workspace }}/*.deb
