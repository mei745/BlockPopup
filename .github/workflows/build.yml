name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest  # 必须使用 macOS 运行器（iOS 编译依赖 Xcode）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Theos Dependencies
        run: |
          # 安装 Theos 依赖工具链
          brew install dpkg wget ldid
          # 安装 iOS SDK（关键步骤，修复编译错误）
          wget https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip master.zip -d ~/theos/sdks
          rm master.zip

      - name: Configure Theos
        run: |
          # 设置 THEOS 环境变量
          echo "export THEOS=~/theos" >> $HOME/.zshrc
          echo "export PATH=\$THEOS/bin:\$PATH" >> $HOME/.zshrc
          echo "export THEOS_DEVICE_IP=127.0.0.1" >> $HOME/.zshrc  # 本地编译无需真机IP
          source $HOME/.zshrc

          # 克隆 Theos 核心仓库
          git clone --recursive https://github.com/theos/theos.git ~/theos

      - name: Build Tweak
        run: |
          # 进入项目目录（根据你的实际目录结构调整）
          cd $GITHUB_WORKSPACE

          # 执行编译（关键：指定 SDK 版本避免 "error: no such file or directory"）
          make SDKVERSION=17.0  # 请替换为你的目标 iOS 版本（如 16.4, 17.0）

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: compiled-tweak
          path: ${{ github.workspace }}/*.deb  # 上传生成的 .deb 安装包
