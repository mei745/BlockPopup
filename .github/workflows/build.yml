name: Build iOS Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & SDK
        run: |
          # 安装依赖
          brew install ldid dpkg perl p7zip
          
          # 配置Theos
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          
          # 解压你的SDK包（强制输出到正确路径）
          mkdir -p $THEOS/sdks/iPhoneOS16.5.sdk
          7z x ./sdks/iPhoneOS16.5.sdk.zip.7z -o$THEOS/sdks/iPhoneOS16.5.sdk
          
          # 验证SDK是否存在（调试用）
          ls -l $THEOS/sdks/

      - name: Build Tweak
        run: |
          make build-deb
          mkdir -p ./output
          cp BlockPopup.deb ./output/

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup-deb
          path: ./output/BlockPopup.deb
