name: Build iOS Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos (Auto SDK)
        run: |
          # 安装依赖
          brew install ldid dpkg perl
          
          # 安装Theos并自动下载SDK
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          $THEOS/bin/update-theos  # 自动补全依赖+SDK

      - name: Build Tweak
        run: |
          make package THEOS=$HOME/theos TARGET=iphone:clang:16.5:14.0
          mkdir -p ./output
          cp .theos/_/*.deb ./output/

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup-deb
          path: ./output/*.deb
