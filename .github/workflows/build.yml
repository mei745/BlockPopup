name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Dependencies
        run: |
          brew install ldid dpkg perl
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          # 解压ZIP格式的SDK包
          mkdir -p $THEOS/sdks
          unzip ./sdks/iPhoneOS16.5.sdk.zip -d $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build Tweak & Package
        run: |
          make clean
          make package
          mkdir -p ./output
          cp .theos/_/*.deb ./output/

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup-deb
          path: ./output/*.deb
