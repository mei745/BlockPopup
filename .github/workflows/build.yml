name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 下载 SDK 并配置 Theos
      - name: Setup Theos & SDK
        run: |
          # 1. 定义路径变量
          THEOS_PATH="/opt/theos"
          SDK_URL="https://github.com/theos/sdks/archive/refs/heads/master.zip"

          # 2. 清理并创建目录
          sudo rm -rf $THEOS_PATH
          sudo mkdir -p $THEOS_PATH

          # 3. 克隆 Theos
          echo "👉 克隆 Theos..."
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS_PATH

          # 4. 下载并解压 SDK 到正确位置
          echo "👉 下载 SDK..."
          wget -qO- $SDK_URL | bsdtar -xvf- -C $THEOS_PATH --strip-components=1 -s '/sdks-master/sdks/'

          # 5. 验证 SDK 是否存在
          echo "👉 当前可用的 SDK："
          ls $THEOS_PATH/sdks

          # 6. 设置环境变量
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH

      # 4. 编译 Tweak
      - name: Build Tweak
        run: |
          # 自动检测最新的 SDK 名称 (例如 iPhoneOS17.5.sdk)
          SDK_NAME=$(ls $THEOS/sdks | head -n 1)

          if [ -z "$SDK_NAME" ]; then
            echo "❌ 错误：未找到 SDK！"
            exit 1
          fi

          echo "✅ 检测到 SDK: $SDK_NAME"

          # 执行编译
          # 注意：这里我们显式指定 SDKVERSION，覆盖 Makefile 里的旧设置
          make clean
          make "SDKVERSION=${SDK_NAME%.sdk}"
      
      # 5. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/*.deb
