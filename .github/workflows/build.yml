name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 配置 Theos 环境 (包含 SDK 安装)
      - name: Setup Theos
        run: |
          # 定义路径
          THEOS_PATH="/opt/theos"
          SDK_TEMP_DIR="$HOME/theos_sdks"
          
          # 设置环境变量 (关键：必须在当前步骤生效)
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH

          # 1. 清理旧环境
          sudo rm -rf $THEOS_PATH
          sudo mkdir -p $THEOS_PATH
          mkdir -p $SDK_TEMP_DIR

          # 2. 克隆 Theos 核心
          echo "🚀 Cloning Theos..."
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS_PATH

          # 3. 下载并安装 SDKs (标准做法：解压到 theos/sdks)
          echo "📦 Downloading iOS SDKs..."
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $SDK_TEMP_DIR --strip-components=1
          
          # 将 SDK 移动到 Theos 的标准目录
          echo "🚚 Moving SDKs to $THEOS_PATH/sdks..."
          sudo mv $SDK_TEMP_DIR $THEOS_PATH/sdks

          # 4. 修复权限 (防止 Permission Denied)
          sudo chown -R $(whoami) $THEOS_PATH
          ls -la $THEOS_PATH/sdks

      # 4. 编译插件
      - name: Build Tweak
        run: |
          # 自动检测 SDK 版本 (例如 iPhoneOS18.0.sdk)
          SDK_NAME=$(ls $THEOS/sdks | head -n 1)
          
          if [ -z "$SDK_NAME" ]; then
            echo "❌ Error: No SDK found in $THEOS/sdks"
            exit 1
          fi

          echo "✅ Using SDK: $SDK_NAME"
          echo "🔧 Building tweak..."

          # 执行编译
          # SDKVERSION 参数会自动覆盖 TARGET 中的 latest
          make clean
          make "SDKVERSION=${SDK_NAME%.sdk}"

      # 5. 打包上传
      - name: Package DEB
        run: |
          # 使用 npack 创建 .deb 包
          if [ -f "$THEOS/bin/npack" ]; then
            $THEOS/bin/npack .
          else
            make package
          fi

      # 6. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Tweak-Package
          path: |
            *.deb
            packages/*.deb
