name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖工具
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 下载 iOS SDK
      - name: Download iOS SDKs
        run: |
          # 创建临时目录下载 SDK
          mkdir -p $HOME/sdks_temp
          # 下载并解压
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $HOME/sdks_temp --strip-components=1

      # 4. 配置 Theos 环境
      - name: Configure Theos
        run: |
          # 1. 设置环境变量
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

          # 2. 强制删除旧文件并克隆 Theos
          sudo rm -rf /opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos

          # 3. 将刚才下载的 SDK 移动到 Theos 目录
          sudo mv $HOME/sdks_temp /opt/theos/sdks

          # 4. 验证 SDK 是否存在
          ls /opt/theos/sdks

      # 5. 编译插件 (自动适配 SDK 版本)
      - name: Build Tweak
        run: |
          # 核心修复：使用 $THEOS 变量指向正确的路径 /opt/theos
          echo "🔍 正在查找 SDK..."
          export SDK=$(ls $THEOS/sdks | head -n 1)

          if [ -z "$SDK" ]; then
            echo "❌ 错误：未找到 SDK！"
            exit 1
          fi

          echo "👉 使用 SDK: $SDK"

          # 执行编译，指定找到的 SDK (去掉 .sdk 后缀)
          make "SDKVERSION=${SDK%.sdk}"

      # 6. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: packages/*.deb
