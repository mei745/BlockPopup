name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & Dependencies
        run: |
          # 安装依赖
          brew install ldid dpkg perl
          
          # 克隆Theos
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          
          # 下载iOS 15.0 SDK（官方镜像源，稳定）
          mkdir -p $THEOS/sdks
          # 替换为官方镜像链接
          curl -L https://cdn.theos.dev/sdks/iPhoneOS15.0.sdk.tar.xz -o $THEOS/sdks/iPhoneOS15.0.sdk.tar.xz
          # 验证文件大小（避免下载失败）
          if [ ! -s "$THEOS/sdks/iPhoneOS15.0.sdk.tar.xz" ]; then
            echo "SDK下载失败！"
            exit 1
          fi
          # 解压SDK
          tar -xJf $THEOS/sdks/iPhoneOS15.0.sdk.tar.xz -C $THEOS/sdks
          
          # 配置环境变量
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build Tweak & Package
        run: |
          make clean
          make package
          mkdir -p ./output
          cp .theos/_/*.deb ./output/

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup-deb
          path: ./output/*.deb
