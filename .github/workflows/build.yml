name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid dpkg xz
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          git clone --depth 1 https://github.com/theos/lib.git $THEOS/lib
          curl -LO https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl
          chmod +x dm.pl
          sudo mv dm.pl /usr/local/bin/
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make package
          ls -la packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup.deb
          path: packages/*.deb
