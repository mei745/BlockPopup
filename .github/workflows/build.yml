name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖工具 (dpkg, ldid, wget)
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 下载 SDK
      - name: Download iOS SDKs
        run: |
          mkdir -p $HOME/theos/sdks
          # 确保下载完整的 SDK 集合
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $HOME/theos/sdks --strip-components=1
          # 调试：列出 SDK 目录，确认里面有什么
          ls $HOME/theos/sdks

      # 4. 配置 Theos (路径修正为 /opt/theos)
      - name: Configure Theos
        run: |
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH
          # 关键：告诉 Theos SDK 在哪里（虽然默认会找 $THEOS/sdks，但显式指定更稳妥）
          echo "THEOS_SDK_DIR=$HOME/theos/sdks" >> $GITHUB_ENV
          
          sudo rm -rf /opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos

      # 5. 编译 (强制指定版本)
      - name: Build Tweak
        run: |
          cd $GITHUB_WORKSPACE
          # 这里强制指定 17.5，避免 Makefile 里写死的 14.5 报错
          make SDKVERSION=17.5

      # 6. 上传产物 (.deb 文件)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: ${{ github.workspace }}/*.deb
