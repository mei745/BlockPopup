name: Build iOS Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1. 检出代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 环境配置与 Theos 安装
    - name: Setup Theos Environment
      run: |
        # 安装 Homebrew
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        
        # 安装必要工具：git, ldid, xz (用于解压sdk)
        brew install git ldid xz
        
        # 克隆 Theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        
        # 设置环境变量
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "$THEOS/bin" >> $GITHUB_PATH

    # 3. 下载并配置 iOS SDK
    - name: Setup iOS SDK
      run: |
        echo "Downloading iOS 16.5 SDK..."
        
        # 创建 SDK 目录
        mkdir -p $THEOS/sdks
        
        # 下载预编译的 SDK (使用 tar.xz 格式，速度更快且稳定)
        # 来源：https://github.com/theos/sdks
        curl -sL https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
        
        # 解压 SDK
        tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks/
        
        # 验证
        ls $THEOS/sdks/

    # 4. 编译 Tweak
    - name: Build Tweak
      run: |
        # 执行 make 打包
        make package
        
        # 列出 deb 包确认生成
        ls -R $THEOS/packages

    # 5. 上传产物 (关键修复点：升级到 v4)
    - name: Upload Deb
      uses: actions/upload-artifact@v4
      with:
        name: BlockPopup-deb
        path: ./packages/*.deb
