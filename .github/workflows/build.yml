name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖
      - name: Install Dependencies
        run: |
          # 尝试安装依赖，如果失败则重试一次（防止网络波动）
          brew install dpkg ldid wget || brew install dpkg ldid wget

      # 3. 配置 Theos 环境 (使用用户目录，避免权限问题)
      - name: Setup Theos
        run: |
          # --- 关键修改：使用 $HOME 目录 ---
          THEOS_PATH="$HOME/theos"
          SDK_TEMP_DIR="$HOME/theos_sdks_temp"
          
          # 设置环境变量 (关键：必须在当前步骤生效)
          echo "THEOS=$THEOS_PATH" >> $GITHUB_ENV
          echo "$THEOS_PATH/bin" >> $GITHUB_PATH

          # 1. 清理旧环境
          rm -rf $THEOS_PATH
          rm -rf $SDK_TEMP_DIR
          mkdir -p $THEOS_PATH
          mkdir -p $SDK_TEMP_DIR

          # 2. 克隆 Theos 核心
          echo "🚀 Cloning Theos..."
          git clone --recursive --depth=1 https://github.com/theos/theos.git $THEOS_PATH

          # 3. 下载并安装 SDKs
          echo "📦 Downloading iOS SDKs..."
          # 下载并解压到临时目录
          wget -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $SDK_TEMP_DIR --strip-components=1
          
          # 移动 SDK 到 Theos 目录 (注意：这里直接移动内容，而不是整个文件夹)
          echo "🚚 Moving SDKs to $THEOS_PATH/sdks..."
          mkdir -p $THEOS_PATH/sdks
          mv $SDK_TEMP_DIR/* $THEOS_PATH/sdks/

          # 列出文件确认
          ls -la $THEOS_PATH/sdks

      # 4. 编译插件
      - name: Build Tweak
        run: |
          # 自动检测 SDK 版本 (例如 iPhoneOS18.0.sdk)
          SDK_NAME=$(ls $THEOS/sdks | head -n 1)
          
          if [ -z "$SDK_NAME" ]; then
            echo "❌ Error: No SDK found in $THEOS/sdks"
            exit 1
          fi

          echo "✅ Using SDK: $SDK_NAME"
          echo "🔧 Building tweak..."

          # 执行编译
          # SDKVERSION 参数会自动覆盖 TARGET 中的 latest
          make clean
          make "SDKVERSION=${SDK_NAME%.sdk}"

      # 5. 打包上传
      - name: Package DEB
        run: |
          # 使用 npack 创建 .deb 包
          if [ -f "$THEOS/bin/npack" ]; then
            $THEOS/bin/npack .
          else
            make package
          fi

      # 6. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Tweak-Package
          path: |
            *.deb
            packages/*.deb
