name: Build iOS Tweak

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1. 检出代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 安装依赖 & 设置 Theos
    - name: Setup Theos
      run: |
        # 安装 Homebrew
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        
        # 安装必要工具：git, ldid, xz (xz用于解压tar.xz)
        brew install git ldid xz
        
        # 克隆 Theos
        git clone --recursive https://github.com/theos/theos.git
        
        # 设置环境变量
        echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV

    # 3. 下载并配置 iOS SDK (已修复格式问题)
    - name: Setup iOS SDK
      run: |
        echo "Downloading iOS 16.5 SDK..."
        
        # 创建 sdks 目录（在当前项目根目录下，而非根目录 /）
        mkdir -p sdks
        
        # 使用正确的 .tar.xz 直链（这是关键修复点）
        # 来源：https://github.com/theos/sdks
        curl -L -o sdks/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz
        
        # 检查文件是否下载成功
        if [ ! -f sdks/iPhoneOS16.5.sdk.tar.xz ]; then
          echo "Error: SDK download failed!"
          exit 1
        fi
        
        # 解压 .tar.xz 文件
        tar -xf sdks/iPhoneOS16.5.sdk.tar.xz -C sdks
        
        # 验证解压结果
        if [ ! -d sdks/iPhoneOS16.5.sdk ]; then
          echo "Error: SDK extraction failed!"
          exit 1
        fi
        
        echo "SDK setup completed successfully."

    # 4. 编译 Tweak
    - name: Build Tweak
      run: |
        # 确保 make 命令能找到 Theos
        export THEOS=$THEOS
        make package
        
    # 5. 上传构建产物
    - name: Upload Deb
      uses: actions/upload-artifact@v4
      with:
        name: BlockPopup-deb
        path: ./debs/*.deb
