name: Build iOS Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Compile Tweak
    runs-on: macos-latest

    steps:
      # 1. 获取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装依赖工具
      - name: Install Dependencies
        run: |
          brew install dpkg ldid wget

      # 3. 下载 iOS SDK 
      - name: Download iOS SDKs
        run: |
          mkdir -p $HOME/sdks_temp
          # 增加重试次数和超时设置，防止网络波动导致失败
          wget -t 3 --timeout=30 -qO- https://github.com/theos/sdks/archive/master.zip | bsdtar -xvf- -C $HOME/sdks_temp --strip-components=1

      # 4. 配置 Theos 环境
      - name: Configure Theos
        run: |
          # 设置环境变量 (使用 sudo 时可能需要传递环境变量，直接写入文件更稳定)
          echo "THEOS=/opt/theos" | sudo tee -a /etc/profile
          echo "/opt/theos/bin" | sudo tee -a /etc/paths
          
          sudo rm -rf /opt/theos
          # 增加 --depth=1 减少克隆时间
          sudo git clone --recursive --depth=1 https://github.com/theos/theos.git /opt/theos
          
          # 移动 SDK
          sudo mv $HOME/sdks_temp/* /opt/theos/sdks/ 2>/dev/null || true
          # 查看结果
          ls -la /opt/theos/sdks/

      # 5. 编译插件 (自动适配 SDK 版本)
      - name: Build Tweak
        run: |
          # 自动检测 SDK 文件夹名称 (例如 iPhoneOS18.0.sdk)
          export SDK=$(ls $THEOS/sdks | head -n 1)
          echo "👉 Using SDK: $SDK"

          # 执行编译，指定找到的 SDK
          make "SDKVERSION=${SDK%.sdk}"
