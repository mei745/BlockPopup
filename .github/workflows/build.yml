name: Build iOS Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos & SDK
        run: |
          brew install ldid dpkg perl p7zip
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          
          # 解压SDK到正确路径
          mkdir -p $THEOS/sdks/iPhoneOS16.5.sdk
          7z x ./sdks/iPhoneOS16.5.sdk.zip.7z -o$THEOS/sdks/iPhoneOS16.5.sdk

      - name: Build Tweak
        run: |
          # 显式传递THEOS变量给make
          make build-deb THEOS=$HOME/theos
          mkdir -p ./output
          cp BlockPopup.deb ./output/

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup-deb
          path: ./output/BlockPopup.deb
