name: Build iOS Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: L1ghtmann/theos-action@main

      - name: Build package
        run: make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockPopup.deb
          path: packages/*.deb
